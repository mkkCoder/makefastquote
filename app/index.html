<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Invoice &amp; quote editor · MakeFastQuote</title>
    <meta
      name="description"
      content="Build a quote, proposal, or invoice and download it as a clean A4 PDF. Everything happens in your browser."
    />
    <!-- The editor is a tool, not a landing page: keep it out of the index and
         point crawlers at the page that should rank. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://makefastquote.com/" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../favicon.svg" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://makefastquote.com/" />
    <meta property="og:title" content="Free Invoice &amp; Quote PDF Generator | MakeFastQuote" />
    <meta
      property="og:description"
      content="Create a freelance invoice, quote, or proposal PDF in minutes. Free, no sign-up."
    />
    <meta property="og:image" content="https://makefastquote.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Invoice &amp; Quote PDF Generator | MakeFastQuote" />
    <meta
      name="twitter:description"
      content="Create a freelance invoice, quote, or proposal PDF in minutes."
    />
    <meta name="twitter:image" content="https://makefastquote.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; max-width: 40rem; margin: 0 auto">
        The invoice editor needs JavaScript to run — it does all its work in your browser rather
        than on a server, which is also why none of your data ever leaves this device. Open the
        <a href="../">MakeFastQuote homepage</a> for a crawlable overview of the tool.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
