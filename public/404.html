<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found | MakeFastQuote</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://makefastquote.com/" />
    <link rel="icon" href="https://makefastquote.com/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="That URL is not a page on MakeFastQuote. Open the free quote and estimate generator instead."
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        display: grid;
        place-items: center;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      }
      main {
        max-width: 36rem;
        width: 100%;
      }
      h1 {
        font-size: clamp(1.5rem, 1.2rem + 2vw, 1.75rem);
        letter-spacing: -0.03em;
        margin: 0 0 0.75rem;
      }
      p {
        color: #334155;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.75rem 1.2rem;
        border-radius: 0.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page is not a quote.</h1>
      <p>
        MakeFastQuote is a small static site: the landing page, the editor, and a few legal
        pages. There is no client-side router pretending unknown URLs exist, so crawlers get a
        real 404 here.
      </p>
      <a href="https://makefastquote.com/">Back to the free quote generator</a>
    </main>
  </body>
</html>
